<header class="header" data-anim-header>
	<div class="header__container">

		<a href="/" class="header__logo">
			<div class="header__logo-mark">IA</div>
			<span class="header__logo-name">Isaac Adjei</span>
		</a>

		<nav class="header__nav" id="headerNav">
			<ul class="header__list">
				<li>
					<if condition="'[[active]]' === 'Home'">
						<a href="/" class="header__link header__link--active">Home</a>
					</if>
					<else>
						<a href="/" class="header__link">Home</a>
					</else>
				</li>
				<li>
					<if condition="'[[active]]' === 'Projects'">
						<a href="/projects.html" class="header__link header__link--active">Projects</a>
					</if>
					<else>
						<a href="/projects.html" class="header__link">Projects</a>
					</else>
				</li>
				<li>
					<if condition="'[[active]]' === 'Contact'">
						<a href="/contact.html" class="header__link header__link--active">Contact</a>
					</if>
					<else>
						<a href="/contact.html" class="header__link">Contact</a>
					</else>
				</li>
			</ul>
		</nav>

		<div class="header__actions">
			<button class="header__theme" id="themeToggle" type="button" aria-label="Toggle theme">
				<svg class="header__theme-icon header__theme-icon--moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
				<svg class="header__theme-icon header__theme-icon--sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
			</button>
			<a href="/contact.html" class="btn btn--primary btn--sm header__cta">Hire Me</a>
			<button class="header__burger" type="button" aria-label="Toggle navigation" id="navBurger">
				<span></span>
				<span></span>
				<span></span>
			</button>
		</div>

	</div>
</header>
