# I configure Dependabot to open weekly dependency update PRs for npm packages
# in both the main app and the PS5 presence Cloudflare Worker, and for GitHub Actions.
# Major version bumps are ignored across all ecosystems to avoid breaking changes landing
# automatically. The automerge-dependabot workflow picks these up and squash-merges them
# once CI passes.

version: 2
updates:
  # Main Next.js app dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Major bumps require manual review - too likely to have breaking changes
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # esbuild updates are locked to the version expected by the installed Next.js
      - dependency-name: "esbuild"

  # PS5 presence Cloudflare Worker
  - package-ecosystem: "npm"
    directory: "/workers/ps5-presence"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "esbuild"

  # GitHub Actions - keeps workflow action versions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      # Staggered 15 min after npm updates so the two batches don't open simultaneously
      time: "07:15"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
