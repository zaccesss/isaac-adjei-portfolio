name: Bug report
description: Report something broken on the live site or in this codebase
title: "fix: "
labels: ["bug"]
assignees:
  - zaccesss
body:
  - type: input
    id: page
    attributes:
      label: Which page or route
      placeholder: "/dashboard/applications or /api/health"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Leave blank if not obvious.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, console output or anything else that might help.
    validations:
      required: false
