# I regenerate all CV artefacts (HTML, PDF, DOCX) from cv.yml on demand via workflow_dispatch.
# After generation I commit the updated files back to main with [skip ci] so the commit
# does not trigger another CI run. Only run this after updating cv.yml or cover letter templates.

name: Auto-Generate CVs

on:
  workflow_dispatch:

jobs:
  generate-cvs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    # Puppeteer needs these system libs to launch a headless Chromium in the CI environment
    - name: Install Chromium dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libcups2 \
          libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 \
          libnss3 libxcomposite1 libxdamage1 libxfixes3 \
          libxkbcommon0 libxrandr2 xdg-utils

    - name: Install dependencies
      run: npm install

    # Each script reads cv.yml and writes its artefacts to public/resume/
    - name: Generate HTML CVs
      run: node scripts/generate-cvs.js

    - name: Generate PDF CVs
      run: node scripts/generate-pdfs.js

    - name: Generate DOCX CVs
      run: node scripts/generate-docx.js

    # Skip the commit step entirely if nothing changed to avoid empty commits
    - name: Check for changes
      id: check-changes
      run: |
        if git diff --quiet public/resume/; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push updated CVs
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add public/resume/cv-*.html public/resume/cv-*.pdf public/resume/cv-*.docx
        # [skip ci] prevents this commit from triggering another CI run
        git commit -m "Auto-regenerate CVs from cv.yml [skip ci]"
        git push
