name: Auto-Generate CVs

on:
  push:
    branches: [ main, master ]
    paths:
      - 'data/cv.yml'
      - 'scripts/generate-cvs.js'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-cvs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate CVs
      run: node scripts/generate-cvs.js
    
    - name: Check for changes
      id: check-changes
      run: |
        if git diff --quiet public/resume/; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit and push updated CVs
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add public/resume/cv*.html
        git commit -m "Auto-regenerate CVs from cv.yml [skip ci]"
        git push
