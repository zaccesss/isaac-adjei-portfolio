# I enable auto-merge (squash) on any PR that is either opened by Dependabot or carries
# the "automerge" label. Draft PRs are skipped. This keeps dependency updates flowing
# without manual intervention while still requiring CI to pass before the merge lands.
#
# gh's `--delete-branch` flag only reliably deletes the branch when it performs an
# immediate merge. When checks are still pending (the common case - this workflow
# fires on every `synchronize` push), gh just enables auto-merge intent and the
# branch deletion does not always happen when the merge completes later. The
# second job below deletes the branch explicitly once GitHub reports the PR as
# merged, independent of how the merge itself was triggered.

name: Auto-merge Dependabot

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge for eligible PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Never auto-merge drafts - they are explicitly not ready
          if [ "$PR_IS_DRAFT" = "true" ]; then
            echo "Draft PR - skipping auto-merge setup"
            exit 0
          fi

          # Enable for Dependabot PRs or any PR labelled "automerge"
          if [ "$PR_AUTHOR" = "dependabot[bot]" ] || echo "$PR_LABELS" | grep -Eq '(^|,)automerge(,|$)'; then
            gh pr merge --auto --squash --delete-branch "$PR_URL"
          else
            echo "Auto-merge not enabled - add the automerge label for non-Dependabot PRs"
          fi

  delete-merged-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete the head branch now that the PR is merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Skip branches from forks - we can't delete those, and they aren't ours anyway
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "$REPO" ]; then
            echo "Head branch is on a fork - skipping"
            exit 0
          fi

          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || echo "Branch already gone"
