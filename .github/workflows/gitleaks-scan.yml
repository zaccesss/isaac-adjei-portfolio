# I scan the repository for hard-coded secrets and credentials on every push to main
# and on every PR targeting main. A pinned gitleaks binary is installed directly to
# avoid the action wrapper that requires a paid licence for SARIF upload on private repos.

name: Gitleaks Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token - read-only access to repository contents.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      # Check out the repository content for scanning.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Install a pinned gitleaks binary directly - avoids the action wrapper
      # which requires a paid licence for SARIF upload on private repos.
      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      # Scan working tree files only (--no-git) for hard-coded credentials.
      # Exits with code 1 if any leak is found, failing the workflow.
      - name: Run Gitleaks
        run: gitleaks detect --no-git --redact --exit-code=1
