# I check which active streaks have not yet been logged for today and post a Discord
# reminder at 08:00 UTC every morning so nothing is forgotten before the day is over.
# Also triggerable manually via workflow_dispatch for testing.

name: Daily Streak Reminder

on:
  schedule:
    # Runs at 08:00 UTC every day (08:00 GMT in winter, 09:00 BST in summer).
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Send morning streak reminder to Discord
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # I use the service role key so the script can read all rows without RLS blocking it
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx tsx scripts/send-streak-reminder.ts
