# Keeps automerge PRs moving and cleans up after them.
#
# GitHub does not trigger other workflows' `push` or `pull_request` events when the
# action was performed using the workflow's own GITHUB_TOKEN (this prevents recursive
# workflow loops). Our automerge job in automerge-dependabot.yml merges PRs via the
# GITHUB_TOKEN, so neither this workflow's old `push: main` trigger nor the
# `pull_request: closed` trigger in automerge-dependabot.yml ever fired for bot-driven
# merges - PRs sat permanently "behind" main and merged branches were never deleted.
#
# A `schedule` trigger does not depend on what authored the previous event, so it is
# the only reliable way to keep this working regardless of who/what performed the merge.
#
# Both maintenance tasks run as steps in a single job rather than separate jobs -
# GitHub bills Actions minutes per job rounded up to the nearest minute, so two jobs
# per run would cost double even though each step finishes in a few seconds. At every
# 2 hours this costs roughly 360 minutes/month (12 runs/day x 30 days x 1 billed minute).

name: Repo maintenance

on:
  push:
    branches: [main]
  schedule:
    # Every 2 hours - cheap enough to stay well within the monthly Actions minutes
    # budget while still resolving stuck PRs/branches well within the same day
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Update open PRs with auto-merge enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Only target PRs that already have auto-merge set - ignore everything else
          prs=$(gh api repos/$REPO/pulls --jq '[.[] | select(.state=="open" and .auto_merge != null) | .number] | .[]')
          if [ -z "$prs" ]; then
            echo "No open PRs with auto-merge enabled"
          else
            for pr in $prs; do
              echo "Updating branch for PR #$pr"
              # The API returns 422 if the branch is already up to date - treat that as success
              gh api repos/$REPO/pulls/$pr/update-branch --method PUT || echo "PR #$pr already up to date"
            done
          fi

      - name: Delete head branches of merged PRs that still exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Look at recently merged PRs - their head branch should have been deleted
          # at merge time but the GITHUB_TOKEN restriction above means that often didn't fire
          merged_branches=$(gh api "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=30" \
            --jq '[.[] | select(.merged_at != null and .head.repo.full_name == "'"$REPO"'") | .head.ref] | .[]')

          if [ -z "$merged_branches" ]; then
            echo "No recently merged PRs found"
            exit 0
          fi

          while read -r branch; do
            [ "$branch" = "main" ] && continue
            if gh api "repos/$REPO/branches/$branch" >/dev/null 2>&1; then
              echo "Deleting stale merged branch: $branch"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" || echo "Failed to delete $branch - may already be gone"
            fi
          done <<< "$merged_branches"
