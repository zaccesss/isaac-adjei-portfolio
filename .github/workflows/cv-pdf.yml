name: Regenerate CV PDF

on:
  # I trigger automatically whenever the main CV HTML is pushed so the
  # committed artefacts never fall out of sync with the source file.
  push:
    branches:
      - main
    paths:
      - "public/resume/cv.html"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libcups2 \
            libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 \
            libnss3 libxcomposite1 libxdamage1 libxfixes3 \
            libxkbcommon0 libxrandr2 xdg-utils

      - name: Generate PDF from cv.html
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          const path = require('path');
          const fs = require('fs');
          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            const filePath = 'file://' + path.resolve('public/resume/cv.html');
            await page.goto(filePath, { waitUntil: 'networkidle0' });
            const pdf = await page.pdf({
              format: 'A4',
              margin: { top: '11mm', right: '14mm', bottom: '11mm', left: '14mm' },
              printBackground: true,
              preferCSSPageSize: true,
            });
            await browser.close();
            fs.writeFileSync('public/resume/Isaac_Adjei_CV.pdf', pdf);
            console.log('PDF generated:', pdf.length, 'bytes');
          })();
          "

      - name: Generate DOCX from cv.html
        run: |
          # I install html-to-docx locally so it is available without adding it to
          # package.json - this keeps it out of the production bundle.
          npm install --no-save html-to-docx
          node -e "
          const fs = require('fs');
          const path = require('path');
          // I use html-to-docx to convert the CV HTML to a Word document
          const HTMLtoDOCX = require('html-to-docx');
          const html = fs.readFileSync('public/resume/cv.html', 'utf-8');
          HTMLtoDOCX(html, null, { footer: false, pageNumber: false }).then(buffer => {
            fs.writeFileSync('public/resume/Isaac_Adjei_CV.docx', buffer);
            console.log('DOCX generated:', buffer.length, 'bytes');
          });
          "

      - name: Generate role CVs
        # I regenerate all six role-specific CV variants after the main CV is
        # updated so they stay in sync with any new content or structural changes.
        run: node scripts/generate-role-cvs.js

      - name: Create artefact PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/resume/Isaac_Adjei_CV.pdf public/resume/Isaac_Adjei_CV.docx \
                  public/resume/cv-*.pdf public/resume/cv-*.docx public/resume/cv-*.html
          if git diff --staged --quiet; then
            echo "CV artefacts are already up to date."
            exit 0
          fi

          branch="automation/regenerate-cv-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "chore: regenerate CV PDF and DOCX from cv.html"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: regenerate CV download artefacts" \
            --body "Automatically regenerates the committed CV PDF and DOCX after cv.html changed on main."
          gh pr merge "$branch" --squash --delete-branch --auto
