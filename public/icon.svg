<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    :root { --tile: #05070D; --dot: #5778DB; }
    @media (prefers-color-scheme: dark) { :root { --tile: #FAFAFA; --dot: #2445A8; } }
  </style>
  <defs>
    <mask id="ia-knock">
      <rect x="8" y="8" width="84" height="84" rx="20" fill="#FFFFFF"/>
      <text x="41" y="67" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-3" fill="#000000">ia</text>
      <circle cx="28" cy="32.5" r="6.8" fill="#000000"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="84" height="84" rx="20" fill="var(--tile)" mask="url(#ia-knock)"/>
  <circle cx="28" cy="32.5" r="6.8" fill="var(--dot)"/>
  <circle cx="71" cy="62" r="5.6" fill="var(--dot)"/>
</svg>
