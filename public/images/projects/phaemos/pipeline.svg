<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" preserveAspectRatio="xMidYMid meet">
  <rect width="1200" height="750" fill="#111111"/>

  <!-- Title -->
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#f5f5f5">Phaemos - System Architecture</text>
  <text x="600" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#666666">End-to-end predictive maintenance pipeline</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444444"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b8ee8"/>
    </marker>
  </defs>

  <!-- Node 1: Hardware Sensors -->
  <rect x="60" y="220" width="220" height="300" rx="10" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="60" y="220" width="220" height="40" rx="10" fill="#252525"/>
  <rect x="60" y="248" width="220" height="12" fill="#252525"/>
  <text x="170" y="246" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#f5f5f5">Hardware Layer</text>

  <!-- ESP32 chip -->
  <rect x="90" y="278" width="80" height="52" rx="4" fill="#1f2d1f" stroke="#22c55e" stroke-width="1.5"/>
  <text x="130" y="299" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="600" fill="#22c55e">ESP32</text>
  <text x="130" y="314" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#888888">WROOM-32</text>
  <text x="130" y="325" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#555555">I2C · WiFi · MQTT</text>
  <!-- ESP32 pins -->
  <line x1="88" y1="286" x2="76" y2="286" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="88" y1="296" x2="76" y2="296" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="88" y1="306" x2="76" y2="306" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="88" y1="316" x2="76" y2="316" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="170" y1="286" x2="182" y2="286" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="170" y1="296" x2="182" y2="296" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="170" y1="306" x2="182" y2="306" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="170" y1="316" x2="182" y2="316" stroke="#22c55e" stroke-width="1" opacity="0.5"/>

  <!-- STM32 chip -->
  <rect x="190" y="278" width="80" height="52" rx="4" fill="#1f1f2d" stroke="#6b8ee8" stroke-width="1.5"/>
  <text x="230" y="299" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="600" fill="#6b8ee8">STM32</text>
  <text x="230" y="314" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#888888">F4 series</text>
  <text x="230" y="325" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#555555">SPI · ADC · UART</text>

  <!-- Sensor labels -->
  <text x="96" y="352" font-family="ui-monospace,monospace" font-size="10" fill="#888888">→ Temp sensor</text>
  <text x="96" y="368" font-family="ui-monospace,monospace" font-size="10" fill="#888888">→ Pressure sensor</text>
  <text x="96" y="384" font-family="ui-monospace,monospace" font-size="10" fill="#888888">→ Vibration (accel)</text>
  <text x="96" y="400" font-family="ui-monospace,monospace" font-size="10" fill="#888888">→ Current clamp</text>

  <text x="170" y="432" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#555555">RTOS task scheduling</text>
  <text x="170" y="448" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#555555">100 Hz polling rate</text>
  <text x="170" y="464" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#555555">MQTT telemetry</text>
  <text x="170" y="494" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#444444">C / C++ firmware</text>

  <!-- Arrow 1→2 -->
  <line x1="282" y1="370" x2="350" y2="370" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="316" y="362" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#555555">MQTT</text>

  <!-- Node 2: FastAPI Backend -->
  <rect x="352" y="220" width="220" height="300" rx="10" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="352" y="220" width="220" height="40" rx="10" fill="#252525"/>
  <rect x="352" y="248" width="220" height="12" fill="#252525"/>
  <text x="462" y="246" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#f5f5f5">FastAPI Backend</text>

  <text x="372" y="286" font-family="ui-monospace,monospace" font-size="10" fill="#888888">POST /ingest</text>
  <text x="372" y="302" font-family="ui-monospace,monospace" font-size="10" fill="#888888">GET  /sensors/latest</text>
  <text x="372" y="318" font-family="ui-monospace,monospace" font-size="10" fill="#888888">GET  /anomalies</text>
  <text x="372" y="334" font-family="ui-monospace,monospace" font-size="10" fill="#888888">WS   /stream</text>

  <line x1="372" y1="346" x2="552" y2="346" stroke="#2a2a2a" stroke-width="1"/>

  <text x="372" y="366" font-family="ui-monospace,monospace" font-size="10" fill="#666666">Async endpoints</text>
  <text x="372" y="382" font-family="ui-monospace,monospace" font-size="10" fill="#666666">PostgreSQL store</text>
  <text x="372" y="398" font-family="ui-monospace,monospace" font-size="10" fill="#666666">Pydantic validation</text>
  <text x="372" y="414" font-family="ui-monospace,monospace" font-size="10" fill="#666666">WebSocket push</text>

  <text x="462" y="464" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#555555">Python 3.11</text>
  <text x="462" y="480" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#555555">Uvicorn / Gunicorn</text>
  <text x="462" y="496" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#444444">Docker deployment</text>

  <!-- Arrow 2→3 -->
  <line x1="574" y1="370" x2="642" y2="370" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="608" y="362" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#555555">JSON</text>

  <!-- Node 3: ML Model -->
  <rect x="644" y="220" width="220" height="300" rx="10" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="644" y="220" width="220" height="40" rx="10" fill="#252525"/>
  <rect x="644" y="248" width="220" height="12" fill="#252525"/>
  <text x="754" y="246" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#f5f5f5">ML Pipeline</text>

  <!-- Isolation Forest mini diagram -->
  <!-- Tree shapes -->
  <polygon points="754,282 730,330 778,330" fill="none" stroke="#6b8ee8" stroke-width="1.5" opacity="0.6"/>
  <line x1="742" y1="310" x2="730" y2="330" stroke="#6b8ee8" stroke-width="1" opacity="0.4"/>
  <line x1="742" y1="310" x2="754" y2="330" stroke="#6b8ee8" stroke-width="1" opacity="0.4"/>
  <line x1="766" y1="307" x2="754" y2="330" stroke="#6b8ee8" stroke-width="1" opacity="0.4"/>
  <line x1="766" y1="307" x2="778" y2="330" stroke="#6b8ee8" stroke-width="1" opacity="0.4"/>
  <text x="754" y="278" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6b8ee8">Isolation Forest</text>

  <line x1="664" y1="348" x2="844" y2="348" stroke="#2a2a2a" stroke-width="1"/>

  <text x="664" y="368" font-family="ui-monospace,monospace" font-size="10" fill="#666666">n_estimators = 100</text>
  <text x="664" y="384" font-family="ui-monospace,monospace" font-size="10" fill="#666666">contamination = 0.05</text>
  <text x="664" y="400" font-family="ui-monospace,monospace" font-size="10" fill="#666666">Feature scaling: StandardScaler</text>
  <text x="664" y="416" font-family="ui-monospace,monospace" font-size="10" fill="#666666">Rolling 60 s window</text>
  <text x="664" y="432" font-family="ui-monospace,monospace" font-size="10" fill="#666666">Score threshold: −0.20</text>

  <!-- Anomaly output indicator -->
  <rect x="664" y="450" width="90" height="22" rx="4" fill="#ef444422" stroke="#ef4444" stroke-width="1"/>
  <text x="709" y="465" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#ef4444">anomaly = true</text>
  <rect x="762" y="450" width="80" height="22" rx="4" fill="#22c55e22" stroke="#22c55e" stroke-width="1"/>
  <text x="802" y="465" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#22c55e">normal</text>

  <text x="754" y="494" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#555555">scikit-learn</text>
  <text x="754" y="510" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#444444">numpy · pandas</text>

  <!-- Arrow 3→4 -->
  <line x1="866" y1="370" x2="934" y2="370" stroke="#6b8ee8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="900" y="362" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6b8ee8">WS</text>

  <!-- Node 4: Dashboard -->
  <rect x="936" y="220" width="220" height="300" rx="10" fill="#1a1a1a" stroke="#6b8ee8" stroke-width="1" opacity="0.9"/>
  <rect x="936" y="220" width="220" height="40" rx="10" fill="#1e2240"/>
  <rect x="936" y="248" width="220" height="12" fill="#1e2240"/>
  <text x="1046" y="246" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6b8ee8">Next.js Dashboard</text>

  <!-- Mini chart inside dashboard node -->
  <polyline points="956,310 976,306 996,309 1016,304 1036,308 1056,285 1066,275 1076,280 1096,295 1116,300 1136,302"
    fill="none" stroke="#6b8ee8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <line x1="1056" y1="268" x2="1056" y2="315" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  <line x1="956" y1="328" x2="1136" y2="328" stroke="#252525" stroke-width="1"/>

  <text x="956" y="348" font-family="ui-monospace,monospace" font-size="10" fill="#666666">Live sensor charts</text>
  <text x="956" y="364" font-family="ui-monospace,monospace" font-size="10" fill="#666666">Anomaly alerts</text>
  <text x="956" y="380" font-family="ui-monospace,monospace" font-size="10" fill="#666666">Historical logs</text>
  <text x="956" y="396" font-family="ui-monospace,monospace" font-size="10" fill="#666666">Model score trace</text>
  <text x="956" y="412" font-family="ui-monospace,monospace" font-size="10" fill="#666666">WebSocket updates</text>

  <text x="1046" y="464" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#555555">React · Tailwind CSS</text>
  <text x="1046" y="480" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#555555">Recharts · SWR</text>
  <text x="1046" y="496" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#444444">Vercel deployment</text>

  <!-- Footer caption -->
  <text x="600" y="670" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#444444">Hardware sensors → ingest → anomaly scoring → live dashboard</text>
</svg>
