<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#0e1209"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4d7c0f"/>
    </marker>
    <marker id="arr-active" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a3e635"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#a3e635">avr-zac - Nine-Mode State Machine</text>
  <text x="600" y="70" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#4d7c0f">Button press cycles through modes · ISR-driven transitions · ATmega644P</text>

  <!-- Mode nodes - arranged in a ring with IDLE in centre -->

  <!-- Centre: IDLE -->
  <circle cx="600" cy="390" r="48" fill="#141a0e" stroke="#a3e635" stroke-width="2"/>
  <text x="600" y="386" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#a3e635">IDLE</text>
  <text x="600" y="402" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">Mode 0</text>

  <!-- Mode 1: GPIO - top -->
  <circle cx="600" cy="155" r="42" fill="#141a0e" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="600" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#a3e635">GPIO</text>
  <text x="600" y="167" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">Mode 1</text>

  <!-- Mode 2: INT - top right -->
  <circle cx="830" cy="220" r="42" fill="#141a0e" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="830" y="216" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#a3e635">INT</text>
  <text x="830" y="232" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">Mode 2</text>

  <!-- Mode 3: PWM - right -->
  <circle cx="960" cy="390" r="42" fill="#141a0e" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="960" y="386" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#a3e635">PWM</text>
  <text x="960" y="402" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">Mode 3</text>

  <!-- Mode 4: ADC - bottom right -->
  <circle cx="830" cy="560" r="42" fill="#141a0e" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="830" y="556" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#a3e635">ADC</text>
  <text x="830" y="572" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">Mode 4</text>

  <!-- Mode 5: UART - bottom -->
  <circle cx="600" cy="625" r="42" fill="#141a0e" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="600" y="621" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#a3e635">UART</text>
  <text x="600" y="637" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">Mode 5</text>

  <!-- Mode 6: SPI - bottom left -->
  <circle cx="370" cy="560" r="42" fill="#141a0e" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="370" y="556" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#a3e635">SPI</text>
  <text x="370" y="572" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">Mode 6</text>

  <!-- Mode 7: TIMER - left -->
  <circle cx="240" cy="390" r="42" fill="#141a0e" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="240" y="386" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#a3e635">TIMER</text>
  <text x="240" y="402" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">Mode 7</text>

  <!-- Mode 8: I2C - top left -->
  <circle cx="370" cy="220" r="42" fill="#141a0e" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="370" y="216" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#a3e635">I2C</text>
  <text x="370" y="232" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">Mode 8</text>

  <!-- Mode 9: TETRIS - far right, standalone -->
  <circle cx="1090" cy="390" r="42" fill="#141a0e" stroke="#166534" stroke-width="1.5"/>
  <text x="1090" y="386" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="600" fill="#22c55e">TETRIS</text>
  <text x="1090" y="402" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#166534">Mode 9</text>

  <!-- Arrows: ring (IDLE → GPIO → INT → PWM → ADC → UART → SPI → TIMER → I2C → back) -->
  <!-- IDLE → GPIO (up) -->
  <line x1="600" y1="342" x2="600" y2="197" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GPIO → INT (diagonal right) -->
  <line x1="638" y1="178" x2="791" y2="225" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- INT → PWM (down right) -->
  <line x1="860" y1="256" x2="940" y2="352" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PWM → ADC (down) -->
  <line x1="942" y1="430" x2="862" y2="520" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ADC → UART (down left) -->
  <line x1="794" y1="572" x2="641" y2="611" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- UART → SPI (left) -->
  <line x1="559" y1="611" x2="408" y2="572" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SPI → TIMER (left up) -->
  <line x1="334" y1="526" x2="258" y2="430" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- TIMER → I2C (up right) -->
  <line x1="264" y1="352" x2="334" y2="252" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- I2C → GPIO (right) -->
  <line x1="411" y1="215" x2="559" y2="165" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PWM → TETRIS (right, long hold) -->
  <line x1="1002" y1="390" x2="1048" y2="390" stroke="#166534" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="1024" y="382" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#166534">hold</text>

  <!-- Annotations -->
  <text x="620" y="268" font-family="ui-monospace,monospace" font-size="9" fill="#2d5016">btn press</text>

  <!-- Legend -->
  <rect x="60" y="680" width="12" height="2" fill="#4d7c0f"/>
  <text x="78" y="688" font-family="ui-monospace,monospace" font-size="10" fill="#4d7c0f">button press transition</text>
  <line x1="240" y1="685" x2="260" y2="685" stroke="#166534" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="268" y="688" font-family="ui-monospace,monospace" font-size="10" fill="#166534">long-hold transition</text>
  <circle cx="460" cy="684" r="6" fill="none" stroke="#a3e635" stroke-width="1.5"/>
  <text x="472" y="688" font-family="ui-monospace,monospace" font-size="10" fill="#a3e635">current entry point (IDLE)</text>
</svg>
