  <text x="80" y="618" font-family="ui-monospace,monospace" font-size="10" fill="#4d7c0f">Mode 9: Tetris melody via PWM</text>

  <!-- Code snippet -->
  <rect x="840" y="560" width="310" height="130" rx="6" fill="#141a0e" stroke="#2d3d1a" stroke-width="1"/>
  <text x="856" y="580" font-family="ui-monospace,monospace" font-size="9" fill="#666666">// avr-zac state dispatch</text>
  <text x="856" y="596" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">switch</text>
  <text x="896" y="596" font-family="ui-monospace,monospace" font-size="9" fill="#f5f5f5"> (current_mode) {</text>
  <text x="856" y="612" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">  case</text>
  <text x="888" y="612" font-family="ui-monospace,monospace" font-size="9" fill="#a3e635"> MODE_GPIO</text>
  <text x="952" y="612" font-family="ui-monospace,monospace" font-size="9" fill="#f5f5f5">:  run_gpio(); break;</text>
  <text x="856" y="628" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">  case</text>
  <text x="888" y="628" font-family="ui-monospace,monospace" font-size="9" fill="#a3e635"> MODE_PWM</text>
  <text x="950" y="628" font-family="ui-monospace,monospace" font-size="9" fill="#f5f5f5">:   run_pwm();  break;</text>
  <text x="856" y="644" font-family="ui-monospace,monospace" font-size="9" fill="#4d7c0f">  case</text>
  <text x="888" y="644" font-family="ui-monospace,monospace" font-size="9" fill="#a3e635"> MODE_ADC</text>
  <text x="950" y="644" font-family="ui-monospace,monospace" font-size="9" fill="#f5f5f5">:   run_adc();  break;</text>
  <text x="856" y="660" font-family="ui-monospace,monospace" font-size="9" fill="#555555">  ...</text>
  <text x="856" y="676" font-family="ui-monospace,monospace" font-size="9" fill="#f5f5f5">}</text>
